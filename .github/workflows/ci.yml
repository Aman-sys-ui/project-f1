name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ --cov=src --cov-report=term-missing -v

  lint:
    name: Lint (ruff, black, mypy)
    runs-on: ubuntu-latest
    # Informational only: the codebase currently has pre-existing style
    # findings that predate this workflow. This job reports real signal
    # without blocking merges until those are cleaned up separately.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: ruff
        run: ruff check src/ tests/

      - name: black --check
        run: black --check src/ tests/

      - name: mypy
        run: mypy src/
